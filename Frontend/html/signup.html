<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Healthcare</title>
    <link rel="stylesheet" href="/Frontend/css/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/icofont/1.0.1/css/icofont.css">
</head>
<body>
    <div class="signup-container">

        <div class="image-section">
            <img src="/Frontend/img/slider3.jpg" alt="Healthcare" class="signup-image">
            <div class="image-overlay">
                <h2>Join Us Today</h2>
            </div>
        </div>


        <div class="form-section">
            <div class="form-container">
                <h2>Create Your Account</h2>
                <p>Start your journey to better healthcare today.</p>
                <form method="POST" action="/user/SignUp" id="signup-form">
                    <div class="form-group">
                        <input type="text" name="username" placeholder="UserName" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email"  placeholder="Email" required>
                        
                    </div>
                    <div class="form-group">
                        <input type="password" name="password"  placeholder="Password" required>

                    </div>
                    <div class="form-group">
                        <input type="password" name="confirmpassword"  placeholder="Confirm Password" required>
                        
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn">Sign Up</button>
                    </div>
                    <p id="responseMessage"></p>
                </form>
                <p>Already have an account? <a href="/Frontend/html/login.html" class="link">Login here</a></p>
            </div>
        </div>

    </div>
    
    <script>
        const responseMessage = document.getElementById("responseMessage");
        document.getElementById('signup-form').addEventListener('submit',async(e)=>{
            e.preventDefault();

            const formData=new FormData(e.target);
            const data =Object.fromEntries(formData.entries());

            try {
                const response=await fetch('http://localhost:5000/user/SignUp',{
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify(data)
                })

                const result = await response.json();
                responseMessage.textContent = result.message;
                responseMessage.style.color = result.success ? "green" : "red";
                if (result.success) e.target.reset();
                window.location.href="/Frontend/index.html"

                } catch (error) {
                responseMessage.textContent = "An error occurred. Please try again.";
                responseMessage.style.color = "red";
                e.target.reset()

                setTimeout(()=>{
                    responseMessage.textContent=" ";
                },2000)
                }
        })
        
    
    </script>
    
</body>
</html>
