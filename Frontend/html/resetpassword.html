<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/Frontend/css/resetpassword.css">
</head>
<body>

    <div class="container">
        <h2>Reset Password</h2>

        <div id="reset-form">
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirm-password" name="confirmpassword" placeholder="Confirm Password" required>
            </div>

            <button id="button">Reset Password</button>
            <p id="password-error" class="error"></p>
        </div>

    </div>

    <script>
        async function resetPassword() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get("token"); 

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const passwordError = document.getElementById("password-error");

            console.log("Password:", password);
            console.log("Confirm Password:", confirmPassword);

            if (!password || !confirmPassword) {
                passwordError.textContent = "Both fields are required.";
                return;
            }

            if (password.length < 6) {
                passwordError.textContent = "Password must be at least 6 characters long.";
                return;
            }

            if (password !== confirmPassword) {
                passwordError.textContent = "Passwords do not match.";
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/user/ResetPassword/${token}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ newPassword: password }),
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = "/Frontend/html/login.html";
                } else {
                    passwordError.textContent = data.message || "Error resetting password.";
                }
            } catch (error) {
                passwordError.textContent = "Something went wrong. Try again later.";
            }
        }

        document.getElementById("button").addEventListener("click", resetPassword);
    </script>

</body>
</html>
