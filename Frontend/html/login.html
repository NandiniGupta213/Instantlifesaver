<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Healthcare</title>
    <link rel="stylesheet" href="/Frontend/css/login.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/icofont/1.0.1/css/icofont.css">
</head>
<body>
    <div class="login-container">

        <div class="image-section">
            <img src="/Frontend/img/slider2.jpg" alt="Healthcare" class="login-image">
            <div class="image-overlay">
                <h2>Your Health, Our Priority</h2>
            </div>
        </div>


        <div class="form-section">
            <div class="form-container">
                <h2>Login to Your Account</h2>
                <p>Access all our healthcare services in one place.</p>

                <form method="POST" action="/user/LogIn" id="loginform" autocomplete="off">

                    <div class="form-group">
                        <input type="text" name="email" placeholder="Email" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <input type="text" name="password" placeholder="Password" required autocomplete="off">
                    </div>
                    <p id="responseMessage"></p>
                    <div class="form-actions">
                        <button type="submit" class="btn">Login</button>
                        
                        <a href="/Frontend/html/forgotpasswordform.html"  class="link">Forgot Password?</a>
                    </div>
                </form>

                

                <p>Don’t have an account? <a href="/Frontend/html/signup.html" class="link">Sign up now</a></p>
            </div>
        </div>
    </div>

    <script>

        const responseMessage = document.getElementById("responseMessage");
        document.getElementById('loginform').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('http://localhost:5000/user/LogIn', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                responseMessage.textContent = result.message;
                responseMessage.style.color = result.success ? "green" : "red";

                if (result.success) {
                    e.target.reset();
                    window.location.href = "/Frontend/index.html";
                }
            } catch (error) {
                responseMessage.textContent = "An error occurred. Please try again.";
                responseMessage.style.color = "red";
                e.target.reset();

                setTimeout(() => {
                    responseMessage.textContent = "";
                }, 2000);
                
            }
        });


    </script>
</body>
</html>
