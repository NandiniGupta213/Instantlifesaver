<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="/Frontend/css/resetpassword.css">
</head>
<body>

    <div class="container">
        <h2>Forgot Password</h2>

        <div id="email-form">
            <input type="email" id="email" placeholder="Enter your email" required>
            <button onclick="sendResetLink()">Send Reset Link</button>
            <p id="email-error" class="error"></p>
        </div>


    <script>
       

        async function sendResetLink() {
            const email = document.getElementById("email").value;
            const emailError = document.getElementById("email-error");

            if (!email) {
                emailError.textContent = "Email is required.";
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/user/ForgotPassword", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email }),
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = "/Frontend/html/login.html";
                } else {
                    emailError.textContent = data.message || "Error sending reset link.";
                }
            } catch (error) {
                emailError.textContent = "Something went wrong. Try again later.";
                console.log(error.message)
            }
        }

       
    </script>
    

</body>
</html>
